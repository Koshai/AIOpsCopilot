version: '3.9'

# Production stack — host ports 3001/8001/5452/6382 (avoid 3000, 8000, 5450, 6380 conflicts)
services:

  frontend:
    build:
      context: ./frontend

    container_name: ai_ops_frontend

    ports:
      - "3002:3000"

    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend

    container_name: ai_ops_backend

    ports:
      - "8001:8000"

    env_file:
      - ./backend/.env.prod

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_ops
      REDIS_URL: redis://redis:6379/0

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker

    container_name: ai_ops_worker

    env_file:
      - ./backend/.env.prod

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_ops
      REDIS_URL: redis://redis:6379/0

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16

    container_name: ai_ops_postgres_prod

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_ops

    ports:
      - "5452:5432"

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7

    container_name: ai_ops_redis_prod

    ports:
      - "6382:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  uploads_data:
